[project]
name = "lol-draft-ai"
version = "0.1.0"
description = "Machine learning models and training pipelines for LoL Draft AI"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "skl2onnx>=1.17.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
