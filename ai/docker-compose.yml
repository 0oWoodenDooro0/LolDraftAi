services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/ai
    environment:
      - PYTHONPATH=/workspace/ai
    volumes:
      - ..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python src/train_draft_value.py

  exporter:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/ai
    environment:
      - PYTHONPATH=/workspace/ai
    volumes:
      - ..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python src/export_onnx.py

  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/ai
    environment:
      - PYTHONPATH=/workspace/ai
    volumes:
      - ..:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python src/evaluate.py
