services:
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/ai
    volumes:
      - ..:/workspace
    command: python src/train_draft_value.py

  exporter:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/ai
    volumes:
      - ..:/workspace
    command: python src/export_onnx.py

  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/ai
    volumes:
      - ..:/workspace
    command: python src/evaluate.py
